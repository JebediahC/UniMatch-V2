# arguments for dataset
dataset: gf7-building
data_root: gf7-building # link to directories of real data path berfore using it
nclass: 2
crop_size: 518

# arguments for training
epochs: 60
batch_size: 10 # per GPU x 4 GPUs
lr: 0.000005
lr_multi: 40.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

# arguments for model
model: dpt
backbone: dinov2_base
lock_backbone: False